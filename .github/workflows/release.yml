name: Release

on:
  push:
    tags:
      - "v*"
      - "convergio-local-v*"
      - "convergio-v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

permissions:
  contents: read

jobs:
  policy:
    name: fmt + clippy + test + supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest + supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit
        env:
          RUSTFLAGS: ""

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (nextest)
        run: cargo nextest run --workspace --no-fail-fast

      - name: doc tests
        run: cargo test --workspace --doc

      - name: cargo deny
        run: cargo deny --locked check advisories bans licenses sources

      - name: cargo audit
        run: cargo audit

  build:
    name: build ${{ matrix.name }}
    needs: policy
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: convergio-${{ matrix.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/convergio-${{ matrix.name }}/bin
          cp target/release/convergio dist/convergio-${{ matrix.name }}/bin/
          cp target/release/cvg dist/convergio-${{ matrix.name }}/bin/
          cp target/release/convergio-mcp dist/convergio-${{ matrix.name }}/bin/
          cp README.md LICENSE dist/convergio-${{ matrix.name }}/
          cp convergio-${{ matrix.name }}.spdx.json dist/convergio-${{ matrix.name }}/SBOM.spdx.json
          tar -C dist -czf convergio-${{ matrix.name }}.tar.gz convergio-${{ matrix.name }}

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 \
            convergio-${{ matrix.name }}.tar.gz \
            convergio-${{ matrix.name }}.spdx.json \
            > convergio-${{ matrix.name }}.SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign release artifacts (keyless)
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            convergio-${{ matrix.name }}.tar.gz \
            convergio-${{ matrix.name }}.spdx.json \
            convergio-${{ matrix.name }}.SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            convergio-${{ matrix.name }}.tar.gz
            convergio-${{ matrix.name }}.spdx.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: convergio-${{ matrix.name }}
          path: |
            convergio-${{ matrix.name }}.tar.gz
            convergio-${{ matrix.name }}.tar.gz.sig
            convergio-${{ matrix.name }}.tar.gz.crt
            convergio-${{ matrix.name }}.spdx.json
            convergio-${{ matrix.name }}.spdx.json.sig
            convergio-${{ matrix.name }}.spdx.json.crt
            convergio-${{ matrix.name }}.SHA256SUMS
            convergio-${{ matrix.name }}.SHA256SUMS.sig
            convergio-${{ matrix.name }}.SHA256SUMS.crt

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "convergio-${{ matrix.name }}.tar.gz" \
            "convergio-${{ matrix.name }}.tar.gz.sig" \
            "convergio-${{ matrix.name }}.tar.gz.crt" \
            "convergio-${{ matrix.name }}.spdx.json" \
            "convergio-${{ matrix.name }}.spdx.json.sig" \
            "convergio-${{ matrix.name }}.spdx.json.crt" \
            "convergio-${{ matrix.name }}.SHA256SUMS" \
            "convergio-${{ matrix.name }}.SHA256SUMS.sig" \
            "convergio-${{ matrix.name }}.SHA256SUMS.crt" \
            --clobber

  image:
    name: image + promotion manifest
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.ref_name }}
            ${{ env.IMAGE_REF }}:sha-${{ github.sha }}

      - name: Record image digest
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ steps.build.outputs.digest }}" > convergio-image.DIGEST

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: convergio-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign image (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }}"

      - name: Attest image SBOM (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate convergio-image.spdx.json \
            --type spdxjson \
            "${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }}"

      - name: Generate promotion manifest
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/gen_release_artifact_manifest.py \
            --tag "${GITHUB_REF_NAME}" \
            --git-sha "${GITHUB_SHA}" \
            --git-ref "${GITHUB_REF}" \
            --image-ref "${{ env.IMAGE_REF }}" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --out convergio-artifact-manifest.json

      - name: Sign promotion manifest (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature convergio-artifact-manifest.json.sig \
            --output-certificate convergio-artifact-manifest.json.crt \
            convergio-artifact-manifest.json

      - name: Sign image digest + SBOM (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature convergio-image.DIGEST.sig \
            --output-certificate convergio-image.DIGEST.crt \
            convergio-image.DIGEST

          cosign sign-blob --yes \
            --output-signature convergio-image.spdx.json.sig \
            --output-certificate convergio-image.spdx.json.crt \
            convergio-image.spdx.json

      - name: Checksums (manifest bundle)
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 \
            convergio-image.DIGEST \
            convergio-image.spdx.json \
            convergio-artifact-manifest.json \
            > convergio-artifact-manifest.SHA256SUMS

      - name: Sign checksums (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature convergio-artifact-manifest.SHA256SUMS.sig \
            --output-certificate convergio-artifact-manifest.SHA256SUMS.crt \
            convergio-artifact-manifest.SHA256SUMS

      - name: Attest promotion artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            convergio-image.DIGEST
            convergio-image.DIGEST.sig
            convergio-image.DIGEST.crt
            convergio-image.spdx.json
            convergio-image.spdx.json.sig
            convergio-image.spdx.json.crt
            convergio-artifact-manifest.json
            convergio-artifact-manifest.json.sig
            convergio-artifact-manifest.json.crt
            convergio-artifact-manifest.SHA256SUMS
            convergio-artifact-manifest.SHA256SUMS.sig
            convergio-artifact-manifest.SHA256SUMS.crt

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            convergio-image.DIGEST \
            convergio-image.DIGEST.sig \
            convergio-image.DIGEST.crt \
            convergio-image.spdx.json \
            convergio-image.spdx.json.sig \
            convergio-image.spdx.json.crt \
            convergio-artifact-manifest.json \
            convergio-artifact-manifest.json.sig \
            convergio-artifact-manifest.json.crt \
            convergio-artifact-manifest.SHA256SUMS \
            convergio-artifact-manifest.SHA256SUMS.sig \
            convergio-artifact-manifest.SHA256SUMS.crt \
            --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: convergio-promotion-manifest
          path: |
            convergio-image.DIGEST
            convergio-image.DIGEST.sig
            convergio-image.DIGEST.crt
            convergio-image.spdx.json
            convergio-image.spdx.json.sig
            convergio-image.spdx.json.crt
            convergio-artifact-manifest.json
            convergio-artifact-manifest.json.sig
            convergio-artifact-manifest.json.crt
            convergio-artifact-manifest.SHA256SUMS
            convergio-artifact-manifest.SHA256SUMS.sig
            convergio-artifact-manifest.SHA256SUMS.crt

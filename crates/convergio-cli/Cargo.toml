[package]
name = "convergio-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "cvg — pure HTTP client for the Convergio daemon."
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "cvg"
path = "src/main.rs"

[dependencies]
convergio-api = { workspace = true }
convergio-brand = { workspace = true }
convergio-cli-pr = { workspace = true }
convergio-cli-plan-run = { workspace = true }
convergio-cli-session = { workspace = true }
convergio-coherence = { workspace = true }
convergio-durability = { workspace = true }
convergio-i18n = { workspace = true }
convergio-planner = { workspace = true }
convergio-runner = { workspace = true }
convergio-tui = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# `stream` enables `Response::bytes_stream`, used by `cvg bus tail --follow`
# to consume the daemon's SSE feed (P1.1) without buffering the whole body.
reqwest = { workspace = true, features = ["stream"] }
futures-util = "0.3"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
cargo_metadata = { workspace = true }
walkdir = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }

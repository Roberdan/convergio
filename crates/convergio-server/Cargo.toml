[package]
name = "convergio-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local HTTP daemon for Convergio."
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Pass-through to `convergio-embed/fastembed` so a daemon built with
# `cargo build -p convergio-server --features fastembed` can serve
# real ONNX inference. ADR-0038 § F1-β.
fastembed = ["convergio-embed/fastembed"]

[[bin]]
name = "convergio"
path = "src/main.rs"

[dependencies]
convergio-api = { workspace = true }
convergio-brand = { workspace = true }
convergio-db = { workspace = true }
convergio-durability = { workspace = true }
convergio-ops = { workspace = true }
convergio-bus = { workspace = true }
convergio-lifecycle = { workspace = true }
convergio-planner = { workspace = true }
convergio-thor = { workspace = true }
convergio-executor = { workspace = true }
convergio-graph = { workspace = true }
convergio-ontology = { workspace = true }
convergio-embed = { workspace = true }
convergio-fleet = { workspace = true }
convergio-fleet-routes = { workspace = true }
convergio-server-core = { workspace = true }
convergio-capability-registry = { workspace = true }
convergio-gdpr = { workspace = true }
convergio-reports = { workspace = true }

axum = { workspace = true }
clap = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
ed25519-dalek = { workspace = true }
convergio-graph = { workspace = true }
convergio-cli-session = { workspace = true }
convergio-i18n = { workspace = true }

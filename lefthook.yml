pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: ./scripts/pre-commit-clippy.sh
    file-size:
      glob: "*.rs"
      run: |
        max=0
        for f in {staged_files}; do
          lines=$(wc -l < "$f" | tr -d ' ')
          if [ "$lines" -gt 300 ]; then
            echo "FAIL: $f has $lines lines (max 300)" >&2
            max=1
          fi
        done
        exit $max
    context-budget:
      # Block on hard-fail (>10k lines/crate, exit 1).
      # Allow soft-warn (>5k lines/crate, exit 2) to remind without
      # blocking. Capture the exit code with `||` so any shell mode
      # (including bash with set -e) does not abort the step early.
      run: |
        rc=0
        ./scripts/check-context-budget.sh || rc=$?
        if [ "$rc" -eq 2 ]; then exit 0; fi
        exit $rc
      fail_text: "context budget hard cap exceeded — see CONSTITUTION § Agent context budget"
    worktree-warn:
      # CONSTITUTION § 15: parallel-agent work uses git worktrees, not
      # a shared checkout. Warn (do not block) when committing on a
      # non-main branch from the main checkout — some sessions are
      # genuinely solo-human. Closes F28.
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then exit 0; fi
        wt_count=$(git worktree list | wc -l | tr -d ' ')
        if [ "$wt_count" -le 1 ]; then
          echo "WARN: branch '$branch' is being edited in the main checkout." >&2
          echo "      For parallel-agent work (CONSTITUTION § 15) use:" >&2
          echo "        git worktree add .claude/worktrees/$branch -b $branch" >&2
          echo "      This is advisory; the commit will proceed." >&2
        fi
        exit 0

pre-push:
  parallel: true
  commands:
    workspace-integrity:
      # 2026-05-12 incident: a broad `git checkout --theirs` during
      # merge-cascade marked 457 files (incl. Cargo.toml) as deleted.
      # CI caught it, but only after the push round-trip. This local
      # gate refuses any push that breaks workspace skeleton.
      # No `glob:` — gobwas's `**/*` skips root files (Cargo.toml,
      # AGENTS.md, lefthook.yml), which is exactly the file class
      # this guard exists to protect. Run on every push.
      run: ./scripts/check-workspace-integrity.sh
      fail_text: "workspace skeleton broken — see ./scripts/check-workspace-integrity.sh output"
    docs-auto-blocks:
      # Block pushes that would introduce drift in `<!-- BEGIN AUTO:... -->` blocks.
      # No `glob:` — drift in root-level AGENTS.md or in `auto-regenerated`
      # tables anywhere in the tree is repo-global state, not push-scoped.
      run: cvg docs regenerate --root . --check
      fail_text: "stale AUTO blocks — run `cvg docs regenerate --root .` and commit"
    docs-index:
      # Tier-1 retrieval entry point (CONSTITUTION § 16): keep docs/INDEX.md fresh.
      # No `glob:` — INDEX line counts include root files; gobwas's `**/*`
      # would skip pushes that only touch root and let drift through.
      run: ./scripts/generate-docs-index.sh --check
      fail_text: "docs/INDEX.md is stale — run `./scripts/generate-docs-index.sh` and commit"

commit-msg:
  commands:
    commitlint:
      run: npx --yes @commitlint/cli --edit {1}

post-merge:
  commands:
    cvg-update:
      # F50: after `git pull` / `git merge` brings in changes that
      # touched Cargo.toml or any *.rs file, rebuild + restart the
      # daemon so the running binary matches the workspace tree.
      # `--if-needed` short-circuits when no drift, so this never
      # blocks the user with a 30s rebuild on an unrelated merge.
      glob: "Cargo.toml,**/*.rs"
      run: cvg update --if-needed || true
    fleet-cleanup:
      # 2026-05 insights: across the autonomous PR sessions Claude
      # left 13 stale remote branches and 6 zombie agent_processes
      # behind, and the operator had to clean up by hand. After
      # every merge into the operator's main checkout, sweep:
      #   - worktrees pointing at branches that no longer exist on
      #     origin (their PR closed/merged) → `git worktree prune`
      #     + `git worktree remove --force`;
      #   - local agent/* branches whose remote ref is gone → -D;
      #   - `agent_processes.status='running'` rows whose pid is
      #     no longer alive → exited (P -1).
      # Non-blocking: every step has `|| true` so a transient
      # convergio daemon outage never wedges the post-merge flow.
      run: |
        ./scripts/post-merge-fleet-cleanup.sh || true
      fail_text: "fleet cleanup encountered an issue (non-blocking) — see ./scripts/post-merge-fleet-cleanup.sh"

post-commit:
  commands:
    graph-refresh-nudge:
      # ADR-0014. Nudge the local Convergio daemon to re-build the
      # code graph after a commit. Best-effort: silent when the
      # daemon is down or unreachable, never blocks the commit.
      run: |
        curl -fsS -m 1 -X POST http://127.0.0.1:8420/v1/graph/refresh \
          -H 'Content-Type: application/json' \
          -d '{}' >/dev/null 2>&1 || true
        exit 0

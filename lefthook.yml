pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
    file-size:
      glob: "*.rs"
      run: |
        max=0
        for f in {staged_files}; do
          lines=$(wc -l < "$f" | tr -d ' ')
          if [ "$lines" -gt 300 ]; then
            echo "FAIL: $f has $lines lines (max 300)" >&2
            max=1
          fi
        done
        exit $max
    context-budget:
      # Block on hard-fail (>10k lines/crate, exit 1).
      # Allow soft-warn (>5k lines/crate, exit 2) to remind without
      # blocking. Capture the exit code with `||` so any shell mode
      # (including bash with set -e) does not abort the step early.
      run: |
        rc=0
        ./scripts/check-context-budget.sh || rc=$?
        if [ "$rc" -eq 2 ]; then exit 0; fi
        exit $rc
      fail_text: "context budget hard cap exceeded — see CONSTITUTION § Agent context budget"
    worktree-warn:
      # CONSTITUTION § 15: parallel-agent work uses git worktrees, not
      # a shared checkout. Warn (do not block) when committing on a
      # non-main branch from the main checkout — some sessions are
      # genuinely solo-human. Closes F28.
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then exit 0; fi
        wt_count=$(git worktree list | wc -l | tr -d ' ')
        if [ "$wt_count" -le 1 ]; then
          echo "WARN: branch '$branch' is being edited in the main checkout." >&2
          echo "      For parallel-agent work (CONSTITUTION § 15) use:" >&2
          echo "        git worktree add .claude/worktrees/$branch -b $branch" >&2
          echo "      This is advisory; the commit will proceed." >&2
        fi
        exit 0

commit-msg:
  commands:
    commitlint:
      run: npx --yes @commitlint/cli --edit {1}

pre-push:
  commands:
    docs-regen-check:
      # Block the push if AUTO blocks (cvg docs regenerate) drifted.
      # Recurring CI failures observed on PRs #169, #170, #173 — fix
      # at the source instead of after the fact in CI (P0.5).
      run: cargo run --quiet -p convergio-cli -- docs regenerate --check
      skip:
        - run: test "${LEFTHOOK_SKIP_DOC_REGEN:-0}" = "1"
      fail_text: |
        AUTO blocks are stale. Run:
          cargo run -p convergio-cli -- docs regenerate
          ./scripts/generate-docs-index.sh
        then `git add -A && git commit --amend --no-edit && git push --force-with-lease`.
        To bypass once: LEFTHOOK_SKIP_DOC_REGEN=1 git push (audited).
    docs-index-check:
      # Block the push if docs/INDEX.md drifted from generator output.
      run: ./scripts/generate-docs-index.sh --check
      skip:
        - run: test "${LEFTHOOK_SKIP_DOC_REGEN:-0}" = "1"
      fail_text: |
        docs/INDEX.md is stale. Run:
          ./scripts/generate-docs-index.sh
        then `git add -A && git commit --amend --no-edit && git push --force-with-lease`.

post-merge:
  commands:
    cvg-update:
      # F50: after `git pull` / `git merge` brings in changes that
      # touched Cargo.toml or any *.rs file, rebuild + restart the
      # daemon so the running binary matches the workspace tree.
      # `--if-needed` short-circuits when no drift, so this never
      # blocks the user with a 30s rebuild on an unrelated merge.
      glob: "Cargo.toml,**/*.rs"
      run: cvg update --if-needed || true

post-commit:
  commands:
    graph-refresh-nudge:
      # ADR-0014. Nudge the local Convergio daemon to re-build the
      # code graph after a commit. Best-effort: silent when the
      # daemon is down or unreachable, never blocks the commit.
      run: |
        curl -fsS -m 1 -X POST http://127.0.0.1:8420/v1/graph/refresh \
          -H 'Content-Type: application/json' \
          -d '{}' >/dev/null 2>&1 || true
        exit 0

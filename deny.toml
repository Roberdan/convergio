[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    # paste v1.0.15 is archived by upstream (RUSTSEC-2024-0436) but
    # still pulled in transitively by ratatui 0.29 (no migration to
    # pastey yet). Re-evaluate when ratatui drops the dep. Tracked
    # against ADR-0029 (cvg dash).
    { id = "RUSTSEC-2024-0436", reason = "paste v1.0.15 transitive via ratatui 0.29; revisit when ratatui replaces the dep" },
    # lru 0.12.5 has an unsound IterMut (RUSTSEC-2026-0002, fixed in
    # 0.16.3) but ratatui 0.29 pins the older minor; cvg dash never
    # exercises IterMut. Revisit at the next ratatui upgrade.
    { id = "RUSTSEC-2026-0002", reason = "lru v0.12.5 transitive via ratatui 0.29; cvg dash does not call IterMut. Revisit when ratatui bumps lru" },
    # lopdf 0.34.0 can stack-overflow on deeply nested PDF objects when
    # parsing (RUSTSEC-2026-0187, fixed in 0.42.0). convergio-reports
    # uses lopdf exclusively for PDF *generation* (Document::new,
    # Stream, Operation, xobject::image_from) — it never calls
    # Document::load / load_mem or any other parse entry point on
    # untrusted input. The vulnerable parser is compiled in but never
    # reached at runtime. Revisit when lopdf 0.42 API is adopted.
    { id = "RUSTSEC-2026-0187", reason = "lopdf via convergio-reports; only PDF write path used — load* parse APIs never called. Revisit when lopdf bumped to >= 0.42.0" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "MIT",
    # OSI-approved MIT No Attribution; transitive via jsonschema/referencing.
    "MIT-0",
    # MPL-2.0 is a weak copyleft (file-level): permissive for our
    # link-and-redistribute use case. Pulled in transitively via
    # webpki-roots / similar; compatible with Convergio Community
    # License v1.3.
    "MPL-2.0",
    # NCSA / University of Illinois / NCSA Open Source License.
    # OSI-approved permissive license; appears as part of compound
    # licenses for LLVM-derived crates (e.g. tokenizers' onig dep).
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
# Workspace path dependencies are intentionally versionless in Cargo.toml.
wildcards = "allow"
highlight = "all"
allow-workspace = true
skip = [
    { crate = "getrandom@0.2.17", reason = "transitive duplicate from current lockfile; ratchet when upstreams converge" },
    { crate = "getrandom@0.3.4", reason = "additional version pulled in by fastembed transitive (ADR-0038, F1-β)" },
    { crate = "hashbrown@0.15.5", reason = "transitive duplicate from current lockfile; ratchet when upstreams converge" },
    { crate = "hashbrown@0.16.1", reason = "additional version pulled in by fastembed transitive (ADR-0038, F1-β)" },
    { crate = "thiserror@1.0.69", reason = "transitive duplicate from current lockfile; ratchet when upstreams converge" },
    { crate = "thiserror-impl@1.0.69", reason = "transitive duplicate from current lockfile; ratchet when upstreams converge" },
    { crate = "wit-bindgen@0.51.0", reason = "transitive duplicate from current lockfile; ratchet when upstreams converge" },
    # Brought in transitively by ratatui 0.29 + crossterm 0.28 (cvg dash, ADR-0029).
    { crate = "linux-raw-sys@0.4.15", reason = "transitive duplicate via ratatui/crossterm; ratchet when upstreams converge" },
    { crate = "rustix@0.38.44", reason = "transitive duplicate via ratatui/crossterm; ratchet when upstreams converge" },
    { crate = "unicode-width@0.1.14", reason = "transitive duplicate via ratatui; ratchet when upstreams converge" },
    # Brought in transitively by fastembed 5.13 → tokenizers / hf-hub / ort
    # / image / spm_precompiled (ADR-0038, F1-β). Each line is the older
    # of the two versions that fastembed's dep graph pulls; ratchet when
    # upstreams converge.
    { crate = "base64@0.13.1", reason = "via fastembed/tokenizers/spm_precompiled" },
    { crate = "compact_str@0.9.1", reason = "via fastembed/tokenizers" },
    { crate = "core-foundation@0.9.4", reason = "via fastembed/ort/hf-hub macOS path" },
    { crate = "darling@0.20.11", reason = "via fastembed/ort proc-macros" },
    { crate = "darling_core@0.20.11", reason = "via fastembed/ort proc-macros" },
    { crate = "darling_macro@0.20.11", reason = "via fastembed/ort proc-macros" },
    { crate = "foldhash@0.1.5", reason = "via fastembed/hashbrown older path" },
    { crate = "itertools@0.13.0", reason = "via fastembed/tokenizers" },
    { crate = "nom@7.1.3", reason = "via fastembed/tokenizers" },
    { crate = "pastey@0.1.1", reason = "via fastembed/ort macros" },
    { crate = "r-efi@5.3.0", reason = "via fastembed/getrandom older path" },
]

# Skip the entire windows-sys dependency tree when checking for duplicates.
# windows-sys (and its windows-targets / windows_<arch>_<env> children) is
# routinely pulled in at multiple major versions by mixed-vintage transitive
# dependencies (clap-stack pulls 0.60+, fastembed/dirs pull 0.52, walkdir
# still uses 0.48). The Microsoft maintainers publish each major in parallel
# rather than yanking older releases, so this duplication is the steady
# state, not something to ratchet down. Triggered by dependabot bumps to
# tokio (#244) and tower-http (#246).
skip-tree = [
    { crate = "windows-sys", reason = "windows-* family is split across multiple parallel-published majors; duplication is permanent" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
